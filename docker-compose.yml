name: autello-atelier

services:
  nginx:
    build:
      context: ./nginx
    image: autello-nginx:latest
    container_name: autello_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${CLOSED_API_PORT:-8000}:8000"
      - "${CLOSED_DB_PORT:-5432}:5432"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - internal
    mem_limit: 64m

  backend:
    build:
      context: ./backend
    image: autello-backend:latest
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m

  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=40
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 192m
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  nginx_certs:
