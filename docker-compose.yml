name: autello-atelier

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: autello_nginx
    restart: unless-stopped
    env_file: .env
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - internal
    mem_limit: 48m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  backend:
    build:
      context: ./backend
    image: autello-backend:latest
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=40
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 192m
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - com.centurylinklabs.watchtower.enable=false

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: autello_pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - edge
      - internal
    labels:
      - com.centurylinklabs.watchtower.enable=true

  registry:
    profiles: ["ops"]
    image: registry:2
    container_name: autello_registry
    restart: unless-stopped
    env_file: .env
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Autello Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - ./registry/auth:/auth:ro
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - registry_data:/var/lib/registry
    networks:
      - edge
    mem_limit: 64m
    labels:
      - com.centurylinklabs.watchtower.enable=false

  watchtower:
    profiles: ["ops"]
    image: nickfedor/watchtower:1.12.3
    container_name: autello_watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 48m
    labels:
      - com.centurylinklabs.watchtower.enable=false

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  pgadmin_data:
  registry_data:
